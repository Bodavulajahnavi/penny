{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Your everyday finances, thoughtfully brought together.">
  <title>{% block title %}penny — A little clarity for your money{% endblock %}</title>
  <link rel="icon" href="{% static 'tracker/icon.svg' %}">
  {# Compiled from src/app/globals.css with Tailwind CSS v4 (node scripts/build-python-css.mjs). #}
  <link rel="stylesheet" href="{% static 'tracker/app.css' %}">
  {% block head %}{% endblock %}
</head>
<body>{% block content %}{% endblock %}
<div id="toast" class="toast" role="status" hidden></div>
{% block scripts %}{% endblock %}
</body>
</html>
